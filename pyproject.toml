[project]
name = "studymate"
version = "0.1.0"
description = "AI-powered study planner: RAG chat, flashcards, and calendar-aware scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "sentence-transformers",
    "pymupdf",
    "chromadb",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]